resolver = "2"

[workspace.package]
version = "0.0.3"
authors = ["Andrew"]
edition = "2021"

[workspace.dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
anchor-client = "0.30.1"

[patch.crates-io]
anchor-lang = { git = "https://github.com/coral-xyz/anchor.git", rev = "e4f5d43a062a408213e6e47a79088dec847fc6e7" }
anchor-spl = { git = "https://github.com/coral-xyz/anchor.git", rev = "e4f5d43a062a408213e6e47a79088dec847fc6e7" }
anchor-client = { git = "https://github.com/coral-xyz/anchor.git", rev = "e4f5d43a062a408213e6e47a79088dec847fc6e7" }
