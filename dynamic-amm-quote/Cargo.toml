[package]
name = "dynamic-amm-quote"
version = { workspace = true }
edition = { workspace = true }

[lib]
crate-type = ["cdylib", "lib"]
name = "dynamic_amm_quote"

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
prog_dynamic_amm = { path = "../programs/dynamic-amm", package = "dynamic-amm" }
prog_dynamic_vault = { path = "../programs/dynamic-vault", package = "dynamic-vault" }
anyhow = "1.0.57"
borsh = "1.6.1"
marinade-sdk = { git = "https://github.com/jup-ag/marinade-sdk.git", rev = "fe1cbd37d3e82823714d288db0279530e198ec2f" }
solana-stake-interface = "3.1.0"
spl-token-swap = { git = "https://github.com/jup-ag/solana-program-library.git", rev = "318fdc1d66cef644622f94f9f51d4378639a89a1", features = [
    "no-entrypoint",
] }
spl-stake-pool = "2.0.3"
meteora-stable-swap-math = { git = "https://github.com/jup-ag/stable-swap.git", rev = "fe6d5d26480eaaa8bb5d736363fa572eb92acfc3", package = "stable-swap-math" }
meteora-stable-swap-client = { git = "https://github.com/jup-ag/stable-swap.git", rev = "fe6d5d26480eaaa8bb5d736363fa572eb92acfc3", package = "stable-swap-client" }

[dev-dependencies]
solana-program-test = "3.0.14"
anchor-client = { workspace = true }
solana-account = "3.4.0"
solana-instruction = "3.4.0"
solana-keypair = "3.1.2"
solana-program-pack = "3.1.0"
solana-pubkey = "3.0.0"
solana-sdk-ids = "3.1.0"
solana-signer = "3.0.0"
solana-transaction = "3.1.0"
bincode = "1.3.3"
